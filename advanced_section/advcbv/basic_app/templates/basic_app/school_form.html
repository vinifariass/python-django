{% extends "basic_app/basic_app_base.html" %}

{% block content %}
    <h1>{% if not form.instance.pk %}
        Create New School
    {% else %}
        Update School
    {% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
{% endblock %}
